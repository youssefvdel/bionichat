name: desktop

# Windows and macOS builds. Linux is the development target; each job produces
# a runnable folder (app + tool servers + tunnel helper) with nothing to
# install on the machine.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install UI dependencies and build the UI
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build the tool servers
        shell: bash
        run: cargo build --release --workspace --exclude bionichat

      - name: Toolchain for CEF (Chromium is built with cmake + ninja)
        shell: bash
        run: |
          choco install ninja -y --no-progress
          cmake --version
          ninja --version

      - name: Build the app (CEF renderer)
        shell: bash
        # The frontend is embedded at compile time; cargo will not notice that
        # dist/ changed unless the build script is touched.
        run: |
          touch src-tauri/build.rs
          cargo build --release -p bionichat

      - name: Put the tunnel helper beside the app
        shell: bash
        run: bun run tunnel:build

      - name: Pack the runnable folder (app + tools + tunnel + CEF runtime)
        shell: bash
        run: |
          bun run package
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: bionichat-windows
          path: dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install UI dependencies and build the UI
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build the tool servers
        shell: bash
        run: cargo build --release --workspace --exclude bionichat

      - name: "Build the app (WKWebView: CEF on macOS is unproven here)"
        shell: bash
        run: |
          touch src-tauri/build.rs
          cargo build --release -p bionichat --no-default-features --features wry

      - name: Put the tunnel helper beside the app
        shell: bash
        run: bun run tunnel:build

      - name: Pack the runnable folder
        shell: bash
        run: |
          mkdir -p dist-macos
          cp target/release/bionichat dist-macos/
          cp target/release/fs dist-macos/
          cp target/release/bash dist-macos/
          cp target/release/skill dist-macos/
          cp target/release/bionichat-tunnel dist-macos/
          chmod +x dist-macos/*
          ls -la dist-macos
          ditto -c -k --sequesterRsrc --keepParent dist-macos bionichat-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: bionichat-macos
          path: |
            dist-macos/
            bionichat-macos.zip
