name: windows

# Windows build. Linux stays the development target; this produces a runnable
# folder (app + tool servers + tunnel helper) so the app can be tried on a
# real Windows machine with nothing installed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install UI dependencies and build the UI
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build the tool servers
        shell: bash
        run: cargo build --release --workspace --exclude bionichat

      - name: Build the app (WebView2 renderer)
        shell: bash
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Put the tunnel helper beside the app
        shell: bash
        run: bun run tunnel:build

      - name: Pack the runnable folder
        shell: bash
        run: |
          mkdir -p dist-windows
          cp target/release/bionichat.exe dist-windows/
          cp target/release/fs.exe dist-windows/
          cp target/release/bash.exe dist-windows/
          cp target/release/skill.exe dist-windows/
          cp target/release/bionichat-tunnel.exe dist-windows/
          ls -la dist-windows
          powershell -NoProfile -Command "Compress-Archive -Path 'dist-windows\*' -DestinationPath 'bionichat-windows.zip' -Force"

      - uses: actions/upload-artifact@v4
        with:
          name: bionichat-windows
          path: |
            dist-windows/
            bionichat-windows.zip
