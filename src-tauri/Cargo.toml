[package]
name = "bionichat"
version = "0.1.0"
description = "MCP dashboard shell (Tauri v3 + CEF)"
authors = ["Youssef"]
edition = "2024"
rust-version = "1.95"

[lib]
name = "bionichat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[features]
# Bundled Chromium everywhere: same engine and same pixels on Linux and
# Windows. It needs a C++ chain to build (cmake + ninja, plus MSVC on Windows),
# and on Linux it pulls gtk4 and a ~700 MB CEF download on the first build.
default = ["cef"]
cef = ["dep:tauri-runtime-cef"]
# Opt-out only: the system webview (webkit2gtk on Linux, WebView2 on Windows,
# WKWebView on macOS). Kept for machines that cannot build CEF, and as the
# macOS CI path until CEF there is measured.
wry = ["dep:tauri-runtime-wry"]

[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-runtime-wry = { version = "=3.0.0-alpha.6", optional = true }
tauri-runtime-cef = { version = "=3.0.0-alpha.7", optional = true }
tauri-plugin-log = "3.0.0-alpha.1"
axum = "0.8"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
which = "8"
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rmcp = { workspace = true }
chrono = { workspace = true }
