[package]
name = "web-agent"
version = "0.1.0"
description = "MCP dashboard shell (Tauri v3 + CEF)"
authors = ["Youssef"]
edition = "2024"
rust-version = "1.95"

[lib]
name = "web_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[features]
default = ["wry"]
# System webview (webkit2gtk on Linux). Default so the app runs without the
# ~700 MB CEF download; both renderers are pinned to the same Tauri alpha.
wry = ["dep:tauri-runtime-wry"]
# Bundled Chromium (CEF 154.5.0). Same pixels on every machine; required before
# chats land. Builds gtk4, so it cannot be combined with `wry`.
cef = ["dep:tauri-runtime-cef"]

[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-runtime-wry = { version = "=3.0.0-alpha.6", optional = true }
tauri-runtime-cef = { version = "=3.0.0-alpha.7", optional = true }
tauri-plugin-log = "3.0.0-alpha.1"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
which = "8"
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rmcp = { workspace = true }
