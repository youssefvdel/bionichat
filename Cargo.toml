[workspace]
resolver = "3"
members = ["src-tauri", "tools/fs", "tools/bash", "tools/skill"]

[workspace.dependencies]
rmcp = { version = "=3.11.0", features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "which-command",
] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "net",
    "io-util",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }

[profile.dev]
opt-level = 0
